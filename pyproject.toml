[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "versevad-post-analysis-toolkit"
version = "0.1.0"
description = "Optional command-line research workflows for VerseVAD Complete Audit exports"
readme = "README.md"
requires-python = ">=3.10,<3.15"
authors = [{name = "Nicky Bennett"}]
license = "GPL-3.0-only"
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<4",
    "scipy>=1.11,<2",
    "statsmodels>=0.14,<1",
    "openpyxl>=3.1,<4",
]

[project.urls]
Homepage = "https://github.com/VerseVAD/PostAnalysisToolkit"
Repository = "https://github.com/VerseVAD/PostAnalysisToolkit"

[tool.setuptools]
package-dir = {"" = "scripts"}
packages = ["versevad_tools"]
